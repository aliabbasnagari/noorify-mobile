name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to:
#   1. run the test suite
#   2. build every platform (only if tests pass)
#   3. publish a GitHub Release with all artifacts (only if every build passes)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: noorify

jobs:
  # ---------------------------------------------------------------- tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - run: flutter test

  # ---------------------------------------------------------------- android
  build-android:
    name: Build Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "${APP_NAME}-${GITHUB_REF_NAME}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APP_NAME }}-*-android.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- ios
  # Unsigned: no Apple certificates/profiles are configured, so the IPA must be
  # re-signed (or sideloaded via AltStore/Sideloadly etc.) before it can be
  # installed on a device. See the README notes for adding real signing.
  build-ios:
    name: Build iOS (IPA)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "${APP_NAME}-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.APP_NAME }}-*-ios-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS
  build-macos:
    name: Build macOS (DMG)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build macOS app
        run: |
          flutter build macos --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Create DMG
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          echo "Packaging $APP_PATH"
          mkdir dmg-staging
          cp -R "$APP_PATH" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "${APP_NAME}-${GITHUB_REF_NAME}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.APP_NAME }}-*-macos.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  build-windows:
    name: Build Windows (installer + portable zip)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows app
        run: |
          flutter build windows --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:APP_NAME-$env:GITHUB_REF_NAME-windows-portable.zip"

      - name: Build installer (.exe)
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "//DAppVersion=${GITHUB_REF_NAME#v}" \
            "//DOutputName=${APP_NAME}-${GITHUB_REF_NAME}-windows-setup" \
            packaging/windows/noorify.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ${{ env.APP_NAME }}-*-windows-setup.exe
            ${{ env.APP_NAME }}-*-windows-portable.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- linux
  build-linux:
    name: Build Linux (AppImage + tar.gz)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev

      - run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Build Linux app
        run: |
          flutter build linux --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Package tar.gz
        run: |
          tar -C build/linux/x64/release/bundle -czf "${APP_NAME}-${GITHUB_REF_NAME}-linux-x64.tar.gz" .

      - name: Package AppImage
        run: |
          APPDIR="${APP_NAME}.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -R build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp assets/icon/app_icon.png "$APPDIR/${APP_NAME}.png"

          cat > "$APPDIR/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Noorify
          Comment=Subsonic / OpenSubsonic music player
          Exec=${APP_NAME}
          Icon=${APP_NAME}
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/noorify" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" "${APP_NAME}-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ${{ env.APP_NAME }}-*-linux-x64.tar.gz
            ${{ env.APP_NAME }}-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          # v1.2.3-beta.1, v1.2.3-rc.1, ... are marked as pre-releases
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
